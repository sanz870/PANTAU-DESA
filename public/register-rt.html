<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Ketua RT - PANTAU DESA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .register-card { width: 100%; max-width: 450px; padding: 2rem; border-radius: 15px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .brand-logo { font-size: 1.5rem; font-weight: bold; color: #2ecc71; text-align: center; margin-bottom: 1.5rem; }
        .btn-success { background-color: #2ecc71; border: none; width: 100%; padding: 0.75rem; border-radius: 8px; font-weight: bold; }
        .btn-success:hover { background-color: #27ae60; }
        .form-control { border-radius: 8px; padding: 0.75rem; }
        .form-label { font-weight: 500; color: #555; }
        .back-login { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #777; }
        .back-login a { color: #2ecc71; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-logo">🏡 PANTAU DESA</div>
        <h5 class="text-center mb-4 text-secondary">Pendaftaran Akun Ketua RT</h5>
        
        <form id="registerForm">
            <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap & Gelar</label>
                <input type="text" class="form-control" id="nama" placeholder="Contoh: Pak Budi, S.Pd." required>
            </div>
            <div class="mb-3">
                <label for="noHp" class="form-label">Nomor HP Aktif</label>
                <input type="text" class="form-control" id="noHp" placeholder="Masukkan Nomor HP" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Buat password akun" required>
            </div>
            <div class="mb-4">
                <label for="secretKey" class="form-label">Kode Rahasia Khusus RT</label>
                <input type="password" class="form-control" id="secretKey" placeholder="Masukkan kode rahasia registrasi" required>
            </div>
            
            <button type="submit" class="btn btn-success">Daftar Akun RT</button>
        </form>

        <div class="back-login">
            Sudah punya akun? <a href="/login.html">Masuk di sini</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const noHp = document.getElementById('noHp').value;
            const password = document.getElementById('password').value;
            const secretKey = document.getElementById('secretKey').value;

            try {
                const response = await fetch('/api/auth/register-rt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama, noHp, password, secretKey })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Registrasi Ketua RT berhasil! Silakan login.');
                    window.location.href = '/login.html';
                } else {
                    alert(data.pesan || 'Registrasi gagal, periksa kembali data Anda.');
                }
            } catch (error) {
                console.error('Terjadi kesalahan:', error);
                alert('Tidak dapat terhubung ke server.');
            }
        });
    </script>
</body>
</html>
