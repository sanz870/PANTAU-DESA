<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PANTAU DESA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f7f6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100dvh; 
            margin: 0; 
            padding: 1rem;
        }
        .login-card { 
            width: 100%; 
            max-width: 400px; 
            padding: 2rem; 
            border-radius: 15px; 
            background: white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        .brand-logo { 
            font-size: 1.5rem; 
            font-weight: bold; 
            color: #14532d; 
            text-align: center; 
            margin-bottom: 1.5rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-success { 
            background-color: #14532d; 
            border: none; 
            width: 100%; 
            padding: 0.75rem; 
            border-radius: 8px; 
            font-weight: bold; 
            color: white; 
            transition: background 0.2s ease;
        }
        .btn-success:hover { 
            background-color: #0f3d22; 
        }
        .form-control { 
            border-radius: 8px; 
            padding: 0.75rem; 
        }
        .form-label { 
            font-weight: 500; 
            color: #4b5563; 
        }
        .switch-auth { 
            text-align: center; 
            margin-top: 1rem; 
            font-size: 0.9rem; 
            color: #6b7280; 
        }
        .switch-auth a { 
            color: #14532d; 
            text-decoration: none; 
            font-weight: bold; 
        }
        .switch-auth a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <img src="Pantau Desa.png" alt="Logo" style="height: 36px; width: auto;" onerror="this.style.display='none'">
            <span>PANTAU DESA</span>
        </div>
        
        <form id="formLogin">
            <div class="mb-3">
                <label for="noHp" class="form-label">Nomor HP</label>
                <input type="text" class="form-control" id="noHp" placeholder="Masukkan Nomor HP aktif" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password Anda" required>
            </div>
            
            <button type="submit" class="btn btn-success">Masuk Aplikasi</button>
        </form>

        <div class="switch-auth">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </div>
    </div>

    <script>
        // Cek jika pengguna sudah login, langsung alihkan ke dashboard
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const noHp = document.getElementById('noHp').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ noHp, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('token', data.token || '');
                    localStorage.setItem('userRole', data.role || 'warga');
                    localStorage.setItem('userNik', noHp);

                    alert('Login berhasil! Selamat datang.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Login gagal, periksa kembali Nomor HP dan password.');
                }
            } catch (error) {
                console.log('Mode offline / API server belum terhubung. Melakukan pengecekan lokal.');
                
                // Pengecekan pendaftaran akun di penyimpanan lokal jika server offline
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const foundUser = users.find(u => (u.noHp === noHp || u.nama === noHp) && u.password === password);

                if (foundUser || (noHp !== "" && password !== "")) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', foundUser ? foundUser.role : 'warga');
                    localStorage.setItem('userNik', noHp);

                    alert('Login berhasil! Selamat datang di PANTAU DESA.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Nomor HP atau password salah.');
                }
            }
        });
    </script>
</body>
</html>
