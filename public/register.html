<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - PANTAU DESA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6" style="color: #14532d;">Daftar Akun Warga</h2>
    
    <form id="formRegister" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
        <input type="text" id="regNama" required class="w-full mt-1 p-2 border rounded-lg focus:outline-none" style="focus-ring-color: #14532d;" placeholder="Masukkan nama sesuai KTP">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Nomor HP</label>
        <input type="text" id="regNoHp" required class="w-full mt-1 p-2 border rounded-lg focus:outline-none" placeholder="08xxxxxxxxxx">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="regPassword" required class="w-full mt-1 p-2 border rounded-lg focus:outline-none" placeholder="Buat password">
      </div>

      <button type="submit" class="w-full text-white py-2 rounded-lg font-semibold transition duration-200" style="background-color: #14532d;" onmouseover="this.style.backgroundColor='#0f3d22'" onmouseout="this.style.backgroundColor='#14532d'">Daftar Akun</button>
    </form>

    <p class="text-sm text-center text-gray-600 mt-4">
      Sudah punya akun? <a href="login.html" class="font-semibold hover:underline" style="color: #14532d;">Masuk di sini</a>
    </p>
  </div>

  <script>
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        nama: document.getElementById('regNama').value,
        noHp: document.getElementById('regNoHp').value,
        password: document.getElementById('regPassword').value,
        role: 'warga'
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          alert('Pendaftaran berhasil! Silakan login.');
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Pendaftaran gagal');
        }
      } catch (err) {
        console.error('Error register:', err);
        alert('Terjadi kesalahan koneksi server');
      }
    });
  </script>
</body>
</html>
